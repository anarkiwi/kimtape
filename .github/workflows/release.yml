name: release

# Trusted publishing (OIDC), no API token. PyPI needs a trusted publisher for
# owner anarkiwi, repository kimtape, workflow release.yml, environment pypi.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: tag matches version
        if: github.event_name == 'release'
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$version"
      - name: wheel installs and runs
        run: |
          pip install dist/*.whl
          kimtape --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kimtape/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

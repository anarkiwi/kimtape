name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cc65
      - run: pip install -e ".[dev]"
      - name: black
        run: black --check --diff src tests examples stub
      - name: pylint
        run: pylint src/kimtape tests examples stub
      - name: stub bytes match stub/xmodem.s
        run: python stub/build.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cc65
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e . py65  # the fake board runs the stub on py65
      - name: shellcheck
        run: shellcheck examples/kimventure.sh tests/run_example.sh
      - name: kimventure against a fake board
        run: tests/run_example.sh

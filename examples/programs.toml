[kb9]
title = "Microsoft KB-9 BASIC"
author = "Microsoft for MOS Technology, 1977"
description = "The 6502 BASIC, nine digit floating point, over the terminal"
io = "tty"
start = "2000"
ram = "16K from $2000"
source = "http://retro.hansotten.nl/6502-sbc/kim-1-manuals-and-software/kim-1-software/microsoft-kb-9-basic/kb-9-downloads/"
notes = """
Answer MEMORY SIZE and TERMINAL WIDTH with Enter, and WANT SIN-COS-ATN with Y.
The deposited bytes are the monitor's saved P and stack pointer: $00 clears
decimal mode, $FF resets the stack.  The loader has already written them."""
deposits = [{ addr = "00F1", bytes = "00FF" }]
tapes = [
  { archive = "http://retro.hansotten.nl/uploads/files/kb9v2.zip", member = "kb9V2.ptp" },
]


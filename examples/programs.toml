# Programs that kimtape can fetch and load.  Nothing is redistributed here:
# each entry points at the archive its author or curator publishes.
#
#   io      "tty" if you use it over the serial line after loading,
#           "keypad" if it drives the LED display and hex keypad instead
#   start   address to run from, hex
#   ram     what the board needs beyond the stock 1K
#   tapes   url, or archive + member; add "at" for a raw binary's load address
#
# Extents were read from the tape records themselves; kimtape info will
# confirm them against what you download.

[kimventure]
title = "KIM-Venture"
author = "Bob Leedom, 1979"
description = "Colossal Cave style adventure in 1K, played on six digits"
io = "keypad"
start = "0200"
ram = "expansion RAM through $07FF"
source = "https://github.com/markbush/KIM-Venture"
notes = """
Remove the TTY link (application connector V to 21) before playing: the game
scans the keypad itself and reads that shorted position as a stuck key.
Scoring: ST, then AD 0600 GO.  ST again and AD 0200 GO rejoins the game."""
tapes = [
  { url = "https://raw.githubusercontent.com/markbush/KIM-Venture/main/tape-files/Venture-ZeroPage.ptp" },
  { url = "https://raw.githubusercontent.com/markbush/KIM-Venture/main/tape-files/Venture-Full.ptp" },
]


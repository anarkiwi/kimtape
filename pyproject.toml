[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kimtape"
version = "0.1.0"
description = "Paper tape loader for the MOS Technology KIM-1 and its replicas"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "anarkiwi" }]
keywords = ["kim-1", "6502", "paper-tape", "retrocomputing", "pal-1", "pal-ii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/anarkiwi/kimtape"
Issues = "https://github.com/anarkiwi/kimtape/issues"

[project.scripts]
kimtape = "kimtape.cli:main"

[project.optional-dependencies]
dev = ["black", "pylint", "pytest", "pytest-cov", "pytest-xdist"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-n auto --cov=kimtape --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
# exercised only out of process, by test_module_entry_point
omit = ["*/__main__.py"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint."messages control"]
# byte-level protocol code formats bytes objects, which f-strings cannot do,
# so % formatting is used throughout for consistency
disable = ["consider-using-f-string"]

[tool.pylint.basic]
# pytest reports the test function name on failure, so a docstring restating it
# adds nothing; helpers and fixtures are documented normally
no-docstring-rgx = "^(test_|_)"
